server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted build assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA deep-link fallback: unknown paths serve index.html so Angular's
    # client-side router can take over (incl. the Keycloak redirect routes).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
