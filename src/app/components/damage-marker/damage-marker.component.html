<mat-dialog-content class="dialog-container">
  <div class="scrollable-content">
    <div class="title-container">
      <h2 class="title">Add Damage</h2>
    </div>

    <form [formGroup]="damageForm">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Car Part</mat-label>
        <mat-select formControlName="part">
          <mat-option value="door">Door</mat-option>
          <mat-option value="bumper">Bumper</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Direction</mat-label>
        <mat-select formControlName="direction">
          <mat-option value="left">Left</mat-option>
          <mat-option value="right">Right</mat-option>
          <mat-option value="up">Up</mat-option>
          <mat-option value="down">Down</mat-option>
          <mat-option value="mixed">Mixed</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Damage</mat-label>
        <mat-select formControlName="damageType">
          <mat-option value="scratch">Scratch</mat-option>
          <mat-option value="dent">Dent</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Severity</mat-label>
        <mat-select formControlName="severity">
          <mat-option value="low">Low</mat-option>
          <mat-option value="high">High</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>State</mat-label>
        <mat-select formControlName="state">
          <mat-option value="available">Available</mat-option>
          <mat-option value="not_working">Not Working</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>License Plate</mat-label>
        <input matInput formControlName="licensePlate" placeholder="e.g. AB 123 CD" />
      </mat-form-field>
    </div>
    </form>
    <div class="upload-section" style="width: 100%; margin-bottom: 16px">
      <label style="font-weight: 500; margin-bottom: 6px; display: block">
        Upload Damage Image(s)
      </label>
      <input
        type="file"
        multiple
        (change)="onImageUpload($event)"
        accept="image/*"
        style="margin-bottom: 8px"
      />
      <div *ngIf="uploadedFiles.length > 0">
        <small>{{ uploadedFiles.length }} file(s) selected</small>
      </div>
    </div>
    <p class="instructions">
      Tap or click on the image to mark the damage location.<br />
      Tap/click the dot to remove it.
    </p>
    <div class="image-container">
      <img
        src="assets/car-damage.png"
        alt="Car Image"
        (click)="addMarker($event)"
        style="width: 100%; height: auto; display: block"
      />
      <div
        *ngIf="marker"
        class="marker"
        [style.left.%]="marker.x"
        [style.top.%]="marker.y"
        (click)="removeMarker()"
      ></div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancel</button>
  <button mat-raised-button class="add-btn" [disabled]="damageForm.invalid" (click)="save()">Add</button>
</mat-dialog-actions>
