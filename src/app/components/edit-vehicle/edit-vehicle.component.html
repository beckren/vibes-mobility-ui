<h2 class="title">Edit Vehicle Information</h2>

<form [formGroup]="vehicleForm" class="edit-vehicle-form">
  <mat-card class="form-container">
    <h2 class="subtitle">Car Information</h2>

    <div class="row">
      <div class="column">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Car ID</mat-label>
          <input matInput formControlName="carId" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Registration Date</mat-label>
          <input
            matInput
            [matDatepicker]="registrationDatePicker"
            formControlName="registrationDate"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="registrationDatePicker"
          ></mat-datepicker-toggle>
          <mat-datepicker
            #registrationDatePicker
            touchUi="true"
          ></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Transmission</mat-label>
          <input matInput formControlName="transmission" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tire Type</mat-label>
          <input matInput formControlName="tireType" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Status</mat-label>
          <input matInput formControlName="status" />
        </mat-form-field>
      </div>

      <div class="column">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>MVA</mat-label>
          <input matInput formControlName="mva" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Year</mat-label>
          <input matInput formControlName="year" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Fuel</mat-label>
          <input matInput formControlName="fuel" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tire Information</mat-label>
          <input matInput formControlName="tireInformation" />
        </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
          <mat-label>PM Milleage</mat-label>
          <input matInput />
        </mat-form-field>

      </div>

      <div class="column">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Licence Plate</mat-label>
          <input matInput formControlName="licencePlate" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Brand</mat-label>
          <input matInput formControlName="brand" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Fuel Level</mat-label>
          <input matInput formControlName="fuelLevel" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Equipment</mat-label>
          <input matInput formControlName="equipment" />
        </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
          <mat-label>Turnback Date</mat-label>
          <input
            matInput
            [matDatepicker]="turnbackDatePicker"
            formControlName="turnbackdate"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="turnbackDatePicker"
          ></mat-datepicker-toggle>
          <mat-datepicker
            #turnbackDatePicker
            touchUi="true"
          ></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="column">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Model</mat-label>
          <input matInput formControlName="model" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Color</mat-label>
          <input matInput formControlName="color" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Milleage</mat-label>
          <input matInput formControlName="millage" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>TUV Inspection</mat-label>
          <input matInput formControlName="tuvInspection" />
        </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
          <mat-label>Turnback Milleage</mat-label>
          <input matInput />
        </mat-form-field>
      </div>
    </div>
  </mat-card>
</form>

<div class="buttons-container">
  <button *ngIf="!isEditing" mat-raised-button color="primary" (click)="enableEdit()">Edit</button>
  <button *ngIf="isEditing" mat-button style="color: white" (click)="cancelEdit()">Cancel</button>
  <button *ngIf="isEditing" mat-raised-button class="save-btn">Save</button>
  <button mat-raised-button class="side-btns" (click)="viewDamageHistory()">Damage History</button>
  <button mat-raised-button class="side-btns" (click)="viewMaintenanceHistory()">Maintenance History</button>
  <button mat-stroked-button class="side-btns" (click)="gotoHistory()">Rental History</button>
</div>
