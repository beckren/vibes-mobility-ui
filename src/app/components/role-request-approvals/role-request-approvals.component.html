<h2 class="title">Role Request Approvals</h2>

<p class="hint" *ngIf="!requests.length">
  <mat-icon inline>inbox</mat-icon>
  There are no role requests waiting for your decision.
</p>

<mat-card class="request-card" *ngFor="let r of requests">
  <mat-card-content>
    <div class="request-header">
      <div>
        <strong>{{ r.requesterName }}</strong>
        <span class="email">{{ r.requesterEmail }}</span>
      </div>
      <mat-chip>{{ r.requestedRole }}</mat-chip>
    </div>

    <p class="justification">{{ r.justification }}</p>
    <p class="requested-at">Requested {{ r.createdAt | date: 'short' }}</p>

    <mat-divider></mat-divider>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Decision comment (optional)</mat-label>
      <input matInput [(ngModel)]="comments[r.roleRequestId]" />
    </mat-form-field>

    <div class="actions">
      <button
        mat-raised-button
        color="primary"
        [disabled]="processing[r.roleRequestId]"
        (click)="approve(r)"
      >
        <mat-icon>check</mat-icon> Approve
      </button>
      <button
        mat-stroked-button
        color="warn"
        [disabled]="processing[r.roleRequestId]"
        (click)="reject(r)"
      >
        <mat-icon>close</mat-icon> Reject
      </button>
    </div>
  </mat-card-content>
</mat-card>
