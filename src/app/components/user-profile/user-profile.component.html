<h2 class="title">My Profile</h2>

<mat-card class="form-container">
  <mat-card-content>
    <form [formGroup]="userForm">
      <div class="grid-two-columns">
        <div>
          <h3>User Information</h3>
          <mat-divider></mat-divider><br />
          <mat-form-field appearance="outline">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="fname" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="lname" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Role</mat-label>
            <input matInput formControlName="role" />
          </mat-form-field>
        </div>

        <div>
          <h3>User Credentials</h3>
          <mat-divider></mat-divider><br />
          <mat-form-field appearance="outline">
            <mat-label>Email Address</mat-label>
            <input matInput formControlName="email" readonly />
            <mat-hint>Managed in Keycloak — use "Manage account" to change email or password.</mat-hint>
          </mat-form-field>

          <div class="button-group">
            <button mat-stroked-button type="button" (click)="manageAccount()">
              Manage Account
            </button>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button mat-raised-button class="buttons1" (click)="saveUser()">
          Save
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
